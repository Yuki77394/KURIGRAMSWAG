[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SWAGGYMUSIC"
version = "0.1.0"
description = "🎵 Advanced Telegram Music Bot — Kurigram + ntgcalls + YouTube + Spotify"
readme = "README.md"

requires-python = ">=3.11,<3.13"

license = { text = "MIT" }

authors = [
  { name = "SWAGGYMUSIC" }
]

keywords = ["telegram", "music", "bot", "pyrogram", "kurigram", "pytgcalls", "youtube", "spotify"]

classifiers = [
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Utilities",
]

dependencies = [
  "aiofiles>=23.2.1",
  "aiohttp>=3.9.5",
  "apscheduler>=3.10.4",
  "beautifulsoup4>=4.12.3",
  "dnspython>=2.6.1",
  "gitpython>=3.1.43",
  "hachoir>=3.2.0",
  "httpx>=0.27.0",
  "humanize>=4.9.0",
  "requests>=2.32.3",
  "python-dotenv==1.2.2",
  "pyyaml>=6.0.1",
  "unidecode>=1.3.8",
  "kurigram[fast]==2.2.25",
  "ffmpeg-python>=0.2.0",
  "py-tgcalls==2.3.3",
  "ntgcalls==2.2.5",
  "motor>=3.4.0",
  "psutil>=5.9.8",
  "heroku3>=5.2.1",
  "Pillow==12.3.0",
  "speedtest-cli>=2.1.3",
  "yt-dlp==2026.3.13",
  "youtube-search>=2.1.2",
  "youtube-search-python>=1.6.6",
  "py-yt-search==0.5.7",
  "spotipy==2.26.0",
  "prettytable>=3.12.0",
  "openai>=1.40.0",
  "gTTS",
  "static-ffmpeg"
]

[tool.setuptools.packages.find]
include = ["SWAGGYMUSIC*", "strings*"]

[tool.setuptools]
py-modules = ["config"]

[project.urls]
Repository = "https://github.com/Yuki77394/NEWSRMUSIC"
Issues = "https://github.com/Yuki77394/NEWSRMUSIC/issues"
Changelog = "https://github.com/Yuki77394/NEWSRMUSIC/blob/master/CHANGELOG.md"

[project.scripts]
swaggymusic = "SWAGGYMUSIC.__main__:main"
